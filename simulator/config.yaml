# A new creative that goes live on Friday's run, so the daily refresh shows a new file.
scheduled_ads:
  - campaign: M_WINTER
    launch_date: 2026-09-17
    tone: playful
    discount_pct: 30
    cta: get_offer
    product: Tsitsikamma rain pants

# The deliberate mess. Turn these up or down to change how hard the pipeline has to work.
mess:
  missing_click_id_rate: 0.18                 # click ID stripped from the landing URL
  missing_utm_given_missing_click_rate: 0.45  # of those, UTM tags also missing
  meta_restatement_days: 7                    # Meta keeps adding conversions for up to 7 days
  meta_view_through_rate: 0.20                # Meta claims orders from people who only saw an ad
  post_click_claim_rate: {google: 0.15, meta: 0.7}
  post_click_window_days: {google: 30, meta: 7}
  ga4_purchase_drop_rate: 0.06                # order happened, GA4 purchase event never fired
  ga4_duplicate_purchase_rate: 0.02           # purchase event fired twice
  guest_duplicate_customer_rate: 0.08         # same person, two CRM customer IDs
  refund_rate: 0.03
  google_schema_change_date: 2026-09-01       # Google Ads CSV gains a column from this date

# Planted data quality issues. Codes match KNOWN_ISSUES.md and truth/dq_manifest/.
# Each one is decided by its own seeded generator, so switching one off does not
# change the rest of the world.
dq:
  DQ01_crm_duplicate_export_day_rate: 0.04       # orders.csv appended to itself on some days
  DQ02_ga4_late_event_rate: 0.02                 # event lands in the next day's file
  DQ02_ga4_very_late_event_rate: 0.005           # event lands two days later
  DQ02_ga4_resent_event_rate: 0.005              # event sent on its day AND again next day
  DQ03_refund_delay_days: [2, 10]                # refund appears as a new row days after the sale
  DQ04_late_customer_record_rate: 0.03           # customer row exported a day after their first order
  DQ05_meta_truncated_pull_rate: 0.05            # a Meta pull has one cut-off JSON line
  DQ06_ga4_value_bug: {start: 2026-09-08, end: 2026-09-10, multiplier: 100}
  DQ07_test_orders_per_week: 2                   # QA team places R1.00 orders in production
  DQ08_internal_sessions_per_weekday: 15         # office staff browsing the live site
  DQ09_city_variant_rate: 0.10                   # "JHB", "Joburg", "cape town " ...
  DQ10_campaign_rename: {campaign: G_SHOP, date: 2026-07-01, new_name: ZA_PMax_AllProducts}
  DQ11_fx_weekend_gaps: true                     # no FX rate published on weekends
  DQ12_blank_guest_email_rate: 0.25              # share of duplicate guests with no email captured
