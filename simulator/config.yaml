# Kloof Outdoor simulator config
# Everything that shapes the fake world lives here, so you can change the
# story without touching code.

seed: 42
start_date: 2026-03-20          # first simulated day (history the pLTV model learns from)
dashboard_window_days: 30       # what the dashboard shows by default (informational)
traffic_scale: 1.0              # multiplies ad clicks and organic visits; raise for more volume

fx:
  usd_zar_base: 18.2            # Meta reports spend in USD; this drives the daily rate

cities:
  - {name: Cape Town,    slug: cape_town,    lat: -33.93, lon: 18.42, elevation: 20,   share: 0.35}
  - {name: Johannesburg, slug: johannesburg, lat: -26.20, lon: 28.05, elevation: 1753, share: 0.45}
  - {name: Durban,       slug: durban,       lat: -29.86, lon: 31.03, elevation: 8,    share: 0.20}

# Hidden customer types. The pipeline never sees these labels.
value_types:
  vip:          {daily_repeat_hazard: 0.040, items: [[1, 0.35], [2, 0.40], [3, 0.25]]}
  steady:       {daily_repeat_hazard: 0.012, items: [[1, 0.70], [2, 0.30]]}
  one_and_done: {daily_repeat_hazard: 0.001, items: [[1, 1.00]]}

organic:
  sessions_per_day: 220
  conversion_rate: 0.02
  source_mix: {organic: 0.65, direct: 0.35}
  value_mix: {vip: 0.12, steady: 0.50, one_and_done: 0.38}

repeat_source_mix: {direct: 0.40, email: 0.25, organic: 0.35}

catalog:
  - {id: SKU-JKT-01, name: Drakensberg shell jacket, price: 1899}
  - {id: SKU-BOT-01, name: Cederberg hiking boots,   price: 1249}
  - {id: SKU-FLC-01, name: Karoo fleece,             price: 699}
  - {id: SKU-PNT-01, name: Tsitsikamma rain pants,   price: 899}
  - {id: SKU-BAG-01, name: Table Mountain daypack,   price: 549}
  - {id: SKU-SCK-01, name: Merino trail socks,       price: 249}

